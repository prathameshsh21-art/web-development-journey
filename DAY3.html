<!DOCTYPE html>
<html>
    <head>
        <title>HTML FORMS</title>
    </head>
    <body>
        <h1>HTML FORMS</h1>

        <form>
            <label for="username">Enter username:</label>
            <input type="text" id="username" name="username"  placeholder="your name" required>
            <br><br>
            <label for="email">Enter email:</label>
            <input type="email" id="email" name="email" placeholder="your email" required>
            <br><br>
            <label for="password">Enter password:</label>
            <input type="password" id="password" name="password" placeholder="your password" required>

            <h2><p>Select your age:</p></h2>

            <input type="radio" name = "age" value="0-25" id ="option-1">
            <label for="option-1">0-25</label><br><br>
            <input type="radio" name = "age" value=" 26-50" id="option-2">
            <label for="option-2">26-50</label>
            <input type="radio" name="age" value="51+" id="option-3">
            <label for="option-2">51+</label>

            <br><br>

            <label for="quetions">SECURITY QUETIONS:</label>
            <select name="quetions" id="quetions">
                <option value="q1">WHAT IS THE FIRST LANGAUGE YOU LEARNED?</option>
                <option value="q2">WHICH COUNTRY YOURE IN?</option>
                <option value="q3">WHAT MAKES YOU HAPPY MOST?</option>
            </select>

            <br><br>
            <strong><label for="answer">SECURITY QUETION ANSWER:</label></strong>
            <strong><input type="text" id="answer" name="answer" placeholder="answer" ></strong>

            <br><br>
            <h2><label for="bio">Your bio:</label><br></h2>
            <textarea name="bio" id="bio" cols="30" rows="15" placeholder="about you"></textarea>

            <br><br>
            <input type="submit" value="sumbit the form">
        </form>
    </body>
</html>
