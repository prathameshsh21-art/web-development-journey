<!DOCTYPE html>
<html>
    <head>
        <title>HTML FORMS</title>
    </head>
    <body>
        <h1>HTML FORMS</h1>

        <form>
            <label for="username">Enter username:</label>
            <input type="text" id="username" name="username" placeholder="your name" required>

            <br><br>

            <label for="email">Enter email:</label>
            <input type="email" id="email" name="email" placeholder="your email" required>

            <br><br>

            <label for="password">Enter password:</label>
            <input type="password" id="password" name="password" placeholder="your password" required>

            <h2>Select your age:</h2>

            <input type="radio" name="age" value="0-25" id="option-1">
            <label for="option-1">0-25</label>

            <br><br>

            <input type="radio" name="age" value="26-50" id="option-2">
            <label for="option-2">26-50</label>

            <br><br>

            <input type="radio" name="age" value="51+" id="option-3">
            <label for="option-3">51+</label>

            <br><br>

            <label for="questions">SECURITY QUESTIONS:</label>
            <select name="questions" id="questions">
                <option value="q1">WHAT IS THE FIRST LANGUAGE YOU LEARNED?</option>
                <option value="q2">WHICH COUNTRY ARE YOU FROM?</option>
                <option value="q3">WHAT MAKES YOU HAPPIEST?</option>
            </select>

            <br><br>

            <label for="answer">SECURITY QUESTION ANSWER:</label>
            <input type="text" id="answer" name="answer" placeholder="answer">

            <br><br>

            <h2>Your bio:</h2>
            <textarea name="bio" id="bio" cols="30" rows="15" placeholder="about you"></textarea>

            <br><br>

            <input type="submit" value="submit the form">
        </form>
    </body>
</html>
